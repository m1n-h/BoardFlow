
<main id="board-detail">
    <div class="bg-secondary py-4 mb-4">
        <div class="container">
            <h2 class="text-white text-center fw-bold">Notice Board</h2>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header border-bottom">
                <h3 class="card-title mb-2">{{title}}</h3>
                <div class="text-muted small d-flex justify-content-between">
                    <span>작성자: <strong>{{writer}}</strong></span>
                    <span>작성일: {{createdAt}}</span>
                </div>
            </div>

            <div class="card-body">
                {{content}}
            </div>

            <div class="card-footer d-flex justify-content-end align-items-center">
                <button type="button" class="btn btn-sm btn-secondary py-2">목록으로</button>
                {{actionButtons}}
            </div>
        </div>
    </div>
</main>
