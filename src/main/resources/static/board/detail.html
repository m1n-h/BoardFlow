
<main id="board-detail">
    <div class="bg-secondary py-4 mb-4">
        <div class="container">
            <h2 class="text-white text-center fw-bold">Notice Board</h2>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header border-bottom">
                <h3 class="card-title mb-2 fs-4 fw-bold">{{title}}</h3>
            </div>

            <div class="card-body">
                <div class="text-muted d-flex justify-content-between">
                    <span class="small">작성자: <strong>{{writer}}</strong></span>
                    <span class="small">작성일: {{createdAt}}</span>
                </div>
            </div>

            <div class="card-body py-0">
                <hr class="my-0" />
            </div>

            <div class="card-body">
                {{content}}
            </div>

            <div class="card-footer d-flex justify-content-end align-items-center">
                <a href="/board/list" class="btn btn-sm btn-secondary py-2">목록으로</a>
                {{actionButtons}}
            </div>
        </div>
    </div>
</main>
