{{header}}

<main id="board-list">
    <div class="bg-secondary py-4 mb-4">
        <div class="container">
            <h2 class="text-white text-center fw-bold">Notice Board</h2>
        </div>
    </div>

    <div class="container">
        <h2 class="fs-4 mb-4 fw-bold">게시판 목록</h2>

        <table class="table table-hover border-gray-1-px">
            <thead>
            <tr>
                <th class="text-center">No</th>
                <th class="text-center">제목</th>
                <th class="text-center">작성자</th>
                <th class="text-center">작성일</th>
            </tr>
            </thead>
            <tbody>
            {{#article}}
            <tr>
                <td class="text-center">{{id}}</td>
                <td class="text-center">
                    <a href="/board/detail?id={{id}}" class="text-decoration-none text-black article-detail-link fw-bold" data-id="{{id}}">
                        {{title}}
                    </a>
                </td>
                <td class="text-center">{{writer}}</td>
                <td class="text-center">{{createdAt}}</td>
            </tr>
            {{/article}}
            </tbody>
            <tfoot>
            <tr>
                <td class="text-center" colspan="4"></td>
            </tr>
            </tfoot>
        </table>

        <div class="mt-2 d-flex justify-content-end">
            <a href="/board/write" class="btn btn-sm btn-warning py-2">글쓰기</a>
        </div>

    </div>
</main>

{{footer}}
