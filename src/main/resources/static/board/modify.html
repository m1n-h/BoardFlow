
<main id="board-modify">
    <div class="bg-secondary py-4 mb-4">
        <div class="container">
            <h2 class="text-white text-center fw-bold">Notice Board</h2>
        </div>
    </div>

    <div class="container">
        <h2 class="fs-4 mb-4 fw-bold">게시글 수정</h2>

        <div class="card">
            <div class="card-body">

                <form action="/board/modify" method="post" id="articleUpdateForm">
                    <input type="hidden" name="id" value="{{id}}" />

                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">제목</label>
                        <input type="text"
                               class="form-control"
                               id="title"
                               name="title"
                               value="{{title}}"
                               required
                        />
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label fw-bold">내용</label>
                        <textarea class="form-control"
                                  id="content"
                                  name="content"
                                  rows="5"
                        >{{content}}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/board/detail?id={{id}}" class="btn btn-sm btn-secondary w-50 py-2 article-detail-link" data-id="{{id}}">이전</a>
                        <button type="submit" class="btn btn-sm btn-success w-50 py-2">수정</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</main>
