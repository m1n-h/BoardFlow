{{header}}

<main id="board-write">
    <div class="bg-secondary py-4 mb-4">
        <div class="container">
            <h2 class="text-white text-center fw-bold">Notice Board</h2>
        </div>
    </div>

    <div class="container">
        <h2 class="fs-4 mb-4 fw-bold">게시글 작성</h2>

        <div class="card">
            <div class="card-body">
                <form action="/board/write" method="post" id="articleCreateForm">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">제목</label>
                        <input type="text"
                               class="form-control"
                               id="title"
                               name="title"
                               placeholder="제목을 입력하세요"
                               required
                        />
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label fw-bold">내용</label>
                        <textarea class="form-control"
                                  id="content"
                                  name="content"
                                  rows="5"
                                  placeholder="내용을 입력하세요"
                                  required
                        ></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/board/list" class="btn btn-sm btn-secondary w-50 py-2">이전</a>
                        <button type="submit" class="btn btn-sm btn-primary w-50 py-2">등록</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</main>

{{footer}}
