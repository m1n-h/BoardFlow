{{header}}

<main id="schedule-list">
    <div class="bg-secondary py-4 mb-4">
        <div class="container">
            <h2 class="text-white text-center fw-bold">Schedule</h2>
        </div>
    </div>

    <div class="container">
        <h2 class="fs-4 mb-4 fw-bold">스케줄 목록</h2>

        <table class="table table-striped table-hover border-gray-1-px">
            <thead>
            <tr>
                <th class="text-center">제목</th>
                <th class="text-center">시작일</th>
                <th class="text-center">종료일</th>
                <th class="text-center">작성자</th>
            </tr>
            </thead>
            
            <tbody>
            {{#schedule}}
            <tr>
                <td>
                    <a href="/schedule/detail?id={{id}}" class="text-black schedule-detail-link" data-id="{{id}}">
                        {{title}}
                    </a>
                </td>
                <td class="text-center">{{start}}</td>
                <td class="text-center">{{end}}</td>
                <td class="text-center">{{writer}}</td>
            </tr>
            {{/schedule}}
            </tbody>

            <tfoot>
            <tr>
                <td class="text-center" colspan="4"></td>
            </tr>
            </tfoot>
        </table>

        <div class="d-flex justify-content-end mt-2">
            <a href="/schedule/write" class="btn btn-sm btn-warning py-2 schedule-write-link">일정 등록</a>
        </div>

    </div>
</main>

{{footer}}
