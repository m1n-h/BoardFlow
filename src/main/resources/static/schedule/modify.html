{{header}}

<main id="schedule-modify">
    <div class="bg-secondary py-4 mb-4">
        <div class="container">
            <h2 class="text-white text-center fw-bold">Schedule</h2>
        </div>
    </div>

    <div class="container">
        <h2 class="fs-4 mb-4 fw-bold">일정 수정 - {{title}}</h2>

        <div class="card">
            <div class="card-body">

                <form id="schedule-modify-form" action="/schedule/modify" method="post">
                    <input type="hidden" name="id" value="{{id}}" />
                    <div class="mb-3">
                        <label for="title" class="form-label">제목</label>
                        <input type="text"
                               class="form-control"
                               id="title"
                               name="title"
                               placeholder="일정 제목을 입력하세요"
                               value="{{title}}"
                        />
                    </div>

                    <div class="row">
                        <div class="col-12 col-lg-6 mb-3">
                            <label for="start" class="form-label">📅 시작일시</label>
                            <input type="datetime-local"
                                   class="form-control"
                                   id="start"
                                   name="start"
                                   value="{{start}}"
                            />
                        </div>
                        <div class="col-12 col-lg-6 mb-3">
                            <label for="end" class="form-label">📅 종료일시</label>
                            <input type="datetime-local"
                                   class="form-control"
                                   id="end"
                                   name="end"
                                   value="{{end}}"
                            />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label">상세내용</label>
                        <textarea class="form-control" id="content" name="content" rows="5" placeholder="일정 상세 내용을 입력하세요">
                    {{content}}
                </textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/schedule/detail?id={{id}}" class="btn btn-sm btn-secondary schedule-detail-link w-50 py-2" data-id="{{id}}">이전</a>
                        <button type="submit" class="btn btn-sm btn-success w-50 py-2">수정</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</main>

{{footer}}
