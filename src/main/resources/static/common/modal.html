<div id="authModal" class="modal-overlay d-none">
    <div class="modal-content w-50">

        <div class="card">
            <button type="button" class="modal-close bg-white border-0 text-end border-radius-10-px px-3 fs-5" id="closeModalBtn">&times;</button>

            <div class="card-body pt-1">
                <!-- 로그인 폼 -->
                <form id="loginForm" class="auth-form">
                    <div class="card-header bg-white border-0 p-0 fs-5 fw-bold mb-2">로그인</div>

                    <div class="row">
                        <div class="col-12 mb-3">
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="user-id" class="form-label small">아이디</label>
                                </div>

                                <div class="col-10">
                                    <input type="text"
                                           class="form-control"
                                           id="user-id"
                                           name="user-id"
                                           placeholder=""
                                           required
                                    />
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="user-pw" class="form-label small">비밀번호</label>
                                </div>

                                <div class="col-10">
                                    <input type="password"
                                           class="form-control"
                                           id="user-pw"
                                           name="user-pw"
                                           placeholder=""
                                           required
                                    />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" id="modal-login-btn" class="btn btn-sm btn-primary w-100 py-2">로그인</button>
                    </div>

                </form>

                <!-- 회원가입 폼 -->
                <form id="joinForm" class="auth-form d-none">
                    <div class="card-header bg-white border-0 p-0 fs-5 fw-bold mb-2">회원가입</div>

                    <div class="row">
                        <div class="col-12 mb-3">
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="join-user-name" class="form-label small">이름</label>
                                </div>

                                <div class="col-10">
                                    <input type="text"
                                           class="form-control"
                                           id="join-user-name"
                                           name="user-name"
                                           placeholder=""
                                           required
                                    />
                                </div>
                            </div>
                        </div>

                        <div class="col-12 mb-3">
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="join-user-email" class="form-label small">이메일</label>
                                </div>
                                <div class="col-10">
                                    <div class="row">
                                        <div class="col-6">
                                            <input type="text"
                                                   class="form-control"
                                                   id="join-user-email"
                                                   name="user-email"
                                                   placeholder=""
                                                   required
                                            />
                                        </div>
                                        <div class="col-1">
                                            <span class="text-bold ms-2 me-2">@</span>
                                        </div>
                                        <div class="col-5">
                                            <select id="join-user-domain"
                                                    name="user-domain"
                                                    class="form-control"
                                            >
                                                <option value="">선택</option>
                                                <option value="naver.com">naver.com</option>
                                                <option value="gmail.com">gmail.com</option>
                                            </select>

                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <div class="col-12 mb-3">
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="join-user-id" class="form-label small">아이디</label>
                                </div>

                                <div class="col-10">
                                    <input type="text"
                                           class="form-control"
                                           id="join-user-id"
                                           name="user-id"
                                           placeholder=""
                                           required
                                    />
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="join-user-pw" class="form-label small">비밀번호</label>
                                </div>

                                <div class="col-10">
                                    <input type="password"
                                           class="form-control"
                                           id="join-user-pw"
                                           name="user-pw"
                                           placeholder=""
                                           required
                                    />
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="mt-3">
                        <button type="submit" id="modal-join-btn" class="btn btn-sm btn-primary w-100 py-2">회원가입</button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
