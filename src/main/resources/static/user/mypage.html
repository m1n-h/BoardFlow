{{header}}

<main id="my-page" class="mt-4 mb-4">
    <div class="container">
        <h2 class="mb-4">마이페이지</h2>

        <div class="card p-4">
            <div class="card-header">내 프로필</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="me-2">이름</label>
                    <span class="fw-bold">{{userName}}</span>
                </div>

                <div class="mb-3">
                    <label class="me-2">아이디</label>
                    <span class="fw-bold">{{userId}}</span>
                </div>

                <div class="mb-3">
                    <label class="me-2">이메일</label>
                    <span class="fw-bold">{{userEmail}}</span>
                </div>

                <button type="button" id="return-main" class="btn btn-secondary">HOME</button>
            </div>
        </div>
    </div>
</main>

{{footer}}
