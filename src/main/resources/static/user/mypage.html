{{header}}

<main id="my-page">
    <div class="bg-secondary py-4 mb-4">
        <div class="container">
            <h2 class="text-white text-center fw-bold">MY PAGE</h2>
        </div>
    </div>

    <div class="container">
        <h2 class="fs-4 mb-4 fw-bold">My Page</h2>

        <div class="card">
            <div class="card-header bg-white fs-5 bg-warning-subtle">My Profile</div>

            <div class="card-body">

                <div class="row">
                    <div class="col-12">
                        <div class="row">
                            <div class="col-1">
                                <p class="text-muted">이름</p>
                            </div>
                            <div class="col-11">
                                <p class="fw-bold">{{userName}}</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="row">
                            <div class="col-1">
                                <p class="text-muted">아이디</p>
                            </div>
                            <div class="col-11">
                                <p class="fw-bold">{{userId}}</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="row">
                            <div class="col-1">
                                <p class="text-muted">이메일</p>
                            </div>
                            <div class="col-11">
                                <p class="fw-bold">{{userEmail}}</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <div class="text-center mt-4">
            <button type="button" id="return-main" class="btn btn-sm btn-outline-secondary py-2 w-25">HOME</button>
        </div>

    </div>
</main>

{{footer}}
