{{header}}

<main id="main" class="mt-4 mb-4">
    <div class="container py-5">

        <div class="p-5 mb-4 bg-light rounded-3 shadow-sm text-center">
            <div class="container-fluid py-3">
                <h1 class="display-5 fw-bold text-dark">Board Flow</h1>
                <p class="col-md-8 fs-4 mx-auto text-muted mt-3">
                    자유로운 소통과 체계적인 일정 관리를 한곳에서 경험해 보세요.
                </p>
                <div class="mt-4">
                    <a href="/board/list" class="btn btn-dark btn-lg px-4 me-2">게시판 가기</a>
                    <a href="/schedule/list" class="btn btn-outline-dark btn-lg px-4">일정 관리</a>
                </div>
            </div>
        </div>

        <div class="row align-items-md-stretch g-4 mt-2">

            <div class="col-12 col-md-6">
                <div class="h-100 p-5 bg-white border rounded-3 shadow-sm d-flex flex-column justify-content-between">
                    <div>
                        <h2>💬 자유 게시판</h2>
                        <p class="text-muted mt-3">
                            다양한 사람들과 자유롭게 이야기를 나누고 의견을 공유하는 공간입니다. 소중한 생각을 남겨보세요.
                        </p>
                    </div>
                    <div class="mt-4">
                        <a href="/board/list" class="btn btn-outline-primary">게시글 보러가기 &rarr;</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="h-100 p-5 bg-white border rounded-3 shadow-sm d-flex flex-column justify-content-between">
                    <div>
                        <h2>📅 일정 관리</h2>
                        <p class="text-muted mt-3">
                            중요한 일정과 프로젝트 계획을 놓치지 않도록 체계적으로 관리하고 기록하세요.
                        </p>
                    </div>
                    <div class="mt-4">
                        <a href="/schedule/list" class="btn btn-outline-success">일정 보러가기 &rarr;</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
